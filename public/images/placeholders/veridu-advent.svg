    <path d="M-22 -8 C-16 -16 16 -16 22 -8" fill="#D8A74E" fill-opacity="0.35"/>
    <path d="M-24 -8 H24 L17 7 H-17 Z" fill="#D8A74E" fill-opacity="0.85"/>
