      <stop offset="100%" stop-color="#0F1324"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="22%" r="36%">
      <stop offset="0%" stop-color="#D4A048" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#D4A048" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
